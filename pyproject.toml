[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zguard"
version = "0.1.0"
description = "Privacy firewall for AI workloads: scan, mask and gate log exports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "scikit-learn>=1.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "pre-commit>=3",
]

[project.scripts]
zguard = "zguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
